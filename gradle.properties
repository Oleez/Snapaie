org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# URL of the remote model manifest (latest.json). This is the ONLY place model facts
# enter the app: id, version, filename, download URL, size and SHA-256 all come from it,
# so a new model can ship without a Play Store release.
# Leave blank to disable offline AI (scans fall back to instant heuristic drafts).
# PLACEHOLDER - set to your hosted latest.json before release.
snapaie.model.manifest.url=

# One-time Pro unlock product id (Play Console).
snapaie.billing.lifetime.id=snapaie_pro_lifetime
