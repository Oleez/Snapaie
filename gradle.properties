org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Optional: SHA-256 of the .litertlm files served from your mirror.
# Downloads are verified against these when set — fill in before production release.
snapaie.model.sha256.e2b=
snapaie.model.sha256.e4b=

# Base URL of the self-hosted Gemma mirror, e.g. https://cdn.example.com/snapaie/models
# The file name from ModelTier is appended. Leave blank in dev to fall back to the
# (license-gated) Hugging Face path.
snapaie.model.mirror.base.url=

# One-time Pro unlock product id (Play Console).
snapaie.billing.lifetime.id=snapaie_pro_lifetime
